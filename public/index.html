<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Radar</title>
    <meta name="description" content="A personal AI-industry news radar, curated locally." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131A17'/%3E%3Crect x='6' y='18' width='3' height='8' fill='%23D8F14B'/%3E%3Crect x='11' y='12' width='3' height='14' fill='%23D8F14B'/%3E%3Crect x='16' y='20' width='3' height='6' fill='%23D8F14B'/%3E%3Crect x='21' y='8' width='3' height='18' fill='%23D8F14B'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="wordmark">AI Radar</span>
          <span class="brand-sub" id="brand-sub">connecting to the local service</span>
        </div>

        <div class="status" id="status" aria-live="polite"></div>

        <div class="topbar-actions">
          <nav class="views" aria-label="View">
            <button class="view-btn" data-view="brief" aria-current="page">Brief</button>
            <button class="view-btn" data-view="explore">Explore</button>
          </nav>
          <button class="ghost" id="mark-read">Mark brief read</button>
          <button class="primary" id="scan-now">Scan now</button>
        </div>
      </div>
    </header>

    <div class="hero" id="hero">
      <div class="strip" id="strip" role="img" aria-label="Items collected over the last 24 hours"></div>
      <div class="strip-axis" id="strip-axis"></div>
      <p class="strip-caption" id="strip-caption"></p>
    </div>

    <main id="main" class="main">
      <section id="view-brief" class="view" aria-label="Daily brief"></section>
      <section id="view-explore" class="view" hidden aria-label="Explore"></section>
    </main>

    <footer class="footer">
      <span id="footer-note"></span>
      <span class="footer-links"><a id="link-models" href="#">Choose curator model</a></span>
    </footer>

    <div class="dialog-backdrop" id="model-dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="model-title">
        <h2 id="model-title">Curator model</h2>
        <p class="dialog-note">
          This is the model that reads the day's headlines and writes the brief. It only ever sees the text of the
          collected items, so it needs no tool access.
        </p>
        <div class="field-grid" id="model-fields"></div>
        <div class="dialog-actions">
          <button class="ghost" id="model-cancel">Cancel</button>
          <button class="primary" id="model-save">Use this model</button>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
